name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/dungeon-crawler/package-lock.json
      - name: Test the tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Build and pack the release
        run: python3 tools/pack.py --version "$GITHUB_REF_NAME"
      - name: Check the dungeon crawler build
        run: python3 tools/check_dungeon_build.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="games-$GITHUB_REF_NAME.tar.gz"
          sha=$(cut -d' ' -f1 "dist/$name.sha256")
          gh release create "$GITHUB_REF_NAME" "dist/$name" "dist/$name.sha256" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "All games, packed for bensonlabs.org/projects/games/. sha256 of $name: $sha. To publish it, update the games entry in the blog's _data/components.json (python3 .github/scripts/components.py bump games $GITHUB_REF_NAME)."
