name: Games
# shared with bensonlabs/projects (.github/workflows/ci.yml): change both. Only the lines
# marked "games only" and the workflow's name differ.
#
# Pull requests; pushes to main run the same checks in release.yml before releasing. Also
# lints the workflow files (actionlint, with shellcheck on their scripts).
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7 # games only
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/dungeon-crawler/package-lock.json
      - name: Test the tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Build and pack everything (as a release would)
        run: python3 tools/pack.py
      - name: Check the dungeon crawler build # games only
        run: python3 tools/check_dungeon_build.py
      - name: Packing changes no committed file
        run: git diff --exit-code

  workflows:
    name: Lint the workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A pinned actionlint release, checked against its published sha256 before it runs.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
