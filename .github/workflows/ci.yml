name: Games
# Pull requests; pushes to main run the same checks in release.yml before releasing.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/games/dungeon-crawler/package-lock.json
      - name: Test the tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Build and pack every game (as a release would)
        run: python3 tools/pack.py
      - name: Check the dungeon crawler build
        run: python3 tools/check_dungeon_build.py
      - name: Packing changes no committed file
        run: git diff --exit-code
